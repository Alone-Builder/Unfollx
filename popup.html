<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --grad: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); color-scheme: light dark; }
  body { margin: 0; width: 300px; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { height: 4px; background: var(--grad); }
  main { padding: 14px 16px 16px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 4px 0 12px; opacity: .8; }
  .box { border: 1px solid #8884; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .box.new { border-color: #d62976; }
  button { display: block; width: 100%; margin-top: 8px; border: 0; border-radius: 8px; padding: 9px; font: 600 13px inherit; font-family: inherit; cursor: pointer; background: #8883; color: inherit; }
  button.go { background: #0095f6; color: #fff; }
  button.go:hover { background: #1877f2; }
  [hidden] { display: none; }
  small { opacity: .7; }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <h1>Unfollx</h1>
  <p id="msg">Checking for updates…</p>
  <div class="box new" id="box" hidden>
    <b id="title"></b>
    <small id="how">Download the zip, extract it over your Unfollx folder (replace files), then reload.</small>
    <button class="go" id="dl">Download update</button>
    <button id="reload">Reload extension</button>
  </div>
  <button id="recheck">Check again</button>
</main>
<script src="popup.js"></script>
</body>
</html>
